# DNS interne de Docker. Avec "resolve", les IP des services sont
# re-résolues si un conteneur est recréé.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream auth_service {
    zone auth_service 64k;
    server auth-service:3000 resolve;
    keepalive 16;
}

upstream boat_service {
    zone boat_service 64k;
    server boat-service:8000 resolve;
    keepalive 16;
}

upstream booking_service {
    zone booking_service 64k;
    server booking-service:3001 resolve;
    keepalive 16;
}

limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_status 429;

log_format riviera '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                   '$request_time rid=$request_id';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 16k;
    access_log /var/log/nginx/access.log riviera;

    include /etc/nginx/snippets/security-headers.conf;

    error_page 404 /errors/404.html;
    error_page 500 502 503 504 /errors/50x.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /errors/ {
        internal;
    }

    # auth_request : 204 = ok (+ X-User-Id / X-User-Role), 401 = pas connecté,
    # 403 = rôle insuffisant
    location = /_auth {
        internal;
        proxy_pass http://auth_service/internal/verify;
        include /etc/nginx/snippets/auth-subrequest.conf;
    }

    location = /_auth_admin {
        internal;
        proxy_pass http://auth_service/internal/verify?role=admin;
        include /etc/nginx/snippets/auth-subrequest.conf;
    }

    location @login {
        return 302 /login.html?next=$request_uri;
    }

    location @api401 {
        default_type application/json;
        return 401 '{"error":"Authentification requise"}';
    }
    location @api403 {
        default_type application/json;
        return 403 '{"error":"Accès refusé"}';
    }
    location @api5xx {
        default_type application/json;
        return 503 '{"error":"Service momentanément indisponible"}';
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|svg|ico|png|webp|woff2)$ {
        expires 1h;
        try_files $uri =404;
    }

    location ~ ^/(?:boats|bookings|account)\.html$ {
        auth_request /_auth;
        error_page 401 = @login;
        error_page 404 /errors/404.html;
        error_page 500 502 503 504 /errors/50x.html;
        expires -1;
        try_files $uri =404;
    }

    location = /admin.html {
        auth_request /_auth_admin;
        error_page 401 = @login;
        error_page 403 /errors/403.html;
        error_page 500 502 503 504 /errors/50x.html;
        expires -1;
        try_files $uri =404;
    }

    # auth-service gère ses sessions lui-même, pas d'auth_request ici
    location ~ ^/api/auth/(?:login|register)$ {
        limit_req zone=auth_limit burst=5 nodelay;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_set_header X-User-Id "";
        proxy_set_header X-User-Role "";
        proxy_pass http://auth_service;
    }

    location /api/auth/ {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_set_header X-User-Id "";
        proxy_set_header X-User-Role "";
        proxy_pass http://auth_service;
    }

    # les X-User-* éventuellement envoyés par le client sont écrasés
    location /api/boats {
        auth_request /_auth;
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        auth_request_set $auth_user_role $upstream_http_x_user_role;
        include /etc/nginx/snippets/api-errors.conf;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_set_header X-User-Id $auth_user_id;
        proxy_set_header X-User-Role $auth_user_role;
        proxy_pass http://boat_service;
    }

    location /api/bookings {
        auth_request /_auth;
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        auth_request_set $auth_user_role $upstream_http_x_user_role;
        include /etc/nginx/snippets/api-errors.conf;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_set_header X-User-Id $auth_user_id;
        proxy_set_header X-User-Role $auth_user_role;
        proxy_pass http://booking_service;
    }

    location /api/ {
        default_type application/json;
        return 404 '{"error":"Route inconnue"}';
    }
}
