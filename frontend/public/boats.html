<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La flotte — RivieraBoats</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/boats.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <a class="brand" href="/">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M15.5 6.5V21.5H8.5Z" fill="currentColor"/><path d="M17.5 10V21.5H23.5Z" fill="currentColor" fill-opacity=".65"/><path d="M8 24.5Q16 27.5 24 24.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        Riviera<span>Boats</span>
      </a>
      <nav class="nav" aria-label="Navigation principale"></nav>
      <div class="user-box"></div>
    </div>
  </header>

  <section class="page-hero">
    <div class="inner">
      <div>
        <p class="eyebrow">Notre flotte</p>
        <h1>Trouvez <em>votre bateau</em></h1>
        <p id="count">Chargement de la flotte…</p>
      </div>
    </div>
  </section>

  <main>
    <form id="filters" class="card filters overlap">
      <div class="field">
        <label for="f-port">Port</label>
        <select id="f-port" name="port"><option value="">Tous les ports</option></select>
      </div>
      <div class="field">
        <label for="f-type">Type</label>
        <select id="f-type" name="type"><option value="">Tous les types</option></select>
      </div>
      <div class="field">
        <label for="f-cap">Passagers (min.)</label>
        <input id="f-cap" name="minCapacity" type="number" min="1" max="50" placeholder="ex. 6">
      </div>
      <div class="field">
        <label for="f-price">Budget / jour (max.)</label>
        <input id="f-price" name="maxPrice" type="number" min="1" step="10" placeholder="ex. 500 €">
      </div>
      <div class="field">
        <button class="btn btn-ghost" type="reset">Réinitialiser</button>
      </div>
    </form>

    <div id="boat-list" class="grid" aria-live="polite"></div>
  </main>

  <dialog id="book-dialog" aria-labelledby="book-title">
    <form id="book-form" novalidate>
      <div class="dlg-head" id="book-head">
        <p class="eyebrow" id="book-port">Réservation</p>
        <h2 id="book-title">Réserver</h2>
        <img class="dlg-art" id="book-art" src="/img/boats/voilier.svg" alt="">
      </div>
      <div class="dlg-body">
        <p class="summary" id="book-summary"></p>
        <div class="row">
          <div class="field">
            <label for="b-start">Départ</label>
            <input id="b-start" name="startDate" type="date" required>
          </div>
          <div class="field">
            <label for="b-end">Retour</label>
            <input id="b-end" name="endDate" type="date" required>
          </div>
        </div>
        <p class="hint" id="booked-title">Dates déjà réservées</p>
        <ul class="booked-list" id="booked-list"></ul>
        <p class="estimate" id="estimate"></p>
        <p class="form-error" role="alert"></p>
        <div class="dlg-foot">
          <button type="button" class="btn btn-ghost" id="book-close">Fermer</button>
          <button type="submit" class="btn btn-gold">Réserver et payer <span class="arrow" aria-hidden="true">→</span></button>
        </div>
      </div>
    </form>
  </dialog>

  <footer class="site-footer">
    <div class="inner">
      <span class="footer-brand">Riviera<em>Boats</em></span>
      <span>Nice · Cannes · Antibes · Saint-Tropez · Monaco · Menton</span>
      <span>© 2026 · projet « Dév avec Docker »</span>
    </div>
  </footer>
</body>
</html>
