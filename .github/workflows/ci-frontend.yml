name: ci-frontend

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    # les filtres paths ne s'appliquent pas aux tags : un tag v* relance tout
    paths:
      - frontend/**
      - .github/workflows/ci-frontend.yml
      - .github/workflows/_service.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    uses: ./.github/workflows/_service.yml
    with:
      service: frontend
      context: frontend
      language: static
    secrets: inherit
