name: ci-auth

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    # les filtres paths ne s'appliquent pas aux tags : un tag v* relance tout
    paths:
      - services/auth-service/**
      - .github/workflows/ci-auth.yml
      - .github/workflows/_service.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    uses: ./.github/workflows/_service.yml
    with:
      service: auth
      context: services/auth-service
      language: node
    secrets: inherit
